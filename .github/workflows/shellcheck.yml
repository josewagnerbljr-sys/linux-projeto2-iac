name: shellcheck
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x provisionar-apache.sh validar-servidor.sh remover-apache.sh
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provisionar Apache e validar
        run: |
          sudo ./provisionar-apache.sh --local --skip-upgrade --no-firewall
          sleep 2
          curl -fsS http://localhost/ | grep -qi "Apache provisionado"
